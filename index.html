<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업 진도 및 AI 학습 관리 매니저</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #f8fafc; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 p-2 rounded-lg text-white font-bold">📖</div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight flex items-center">
                            수업 진도 관리 매니저 
                            <span class="ml-2 text-xs bg-purple-600 text-white font-semibold px-2 py-0.5 rounded-full">✨ Gemini AI</span>
                        </h1>
                        <p class="text-xs text-slate-400">학원 및 개인교습 진도표</p>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button onclick="openAiModal()" class="bg-purple-600 hover:bg-purple-500 text-white text-xs sm:text-sm px-3 py-2 rounded-lg font-medium cursor-pointer">✨ AI 알림톡</button>
                    <button onclick="openLogModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs sm:text-sm px-3 py-2 rounded-lg font-medium cursor-pointer">+ 진도 기입</button>
                    <button onclick="openClassModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm px-3 py-2 rounded-lg font-medium border border-slate-700 cursor-pointer">⚙️ 반/과목 관리</button>
                    <button onclick="exportData()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg border border-slate-700 text-xs cursor-pointer">💾 백업</button>
                    <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg border border-slate-700 text-xs cursor-pointer">
                        📂 불러오기
                        <input type="file" accept=".json" onchange="importData(event)" class="hidden">
                    </label>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex justify-between items-center no-print">
            <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200">
                <button id="tab-matrix" onclick="switchView('matrix')" class="px-4 py-1.5 text-sm font-semibold rounded-md text-blue-600 bg-white shadow-sm cursor-pointer">📊 진도표 (매트릭스)</button>
                <button id="tab-history" onclick="switchView('history')" class="px-4 py-1.5 text-sm font-medium rounded-md text-slate-600 cursor-pointer">📜 전체 기록 목록</button>
            </div>

            <div class="flex items-center gap-2 max-w-md">
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="검색어 입력..." class="w-full px-3 py-1.5 text-sm bg-slate-50 border border-slate-300 rounded-lg outline-none">
                <button onclick="window.print()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm px-3 py-1.5 rounded-lg border border-slate-300 cursor-pointer">🖨️ 인쇄</button>
            </div>
        </div>

        <div id="view-matrix" class="space-y-4">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
                <table class="w-full border-collapse text-left text-sm" id="matrix-table">
                    <thead>
                        <tr class="bg-slate-100 border-b border-slate-200 text-slate-700 font-bold text-center">
                            <th class="p-3.5 border-r border-slate-200 w-48 bg-slate-200">반 / 학생 명단</th>
                        </tr>
                    </thead>
                    <tbody id="matrix-body" class="divide-y divide-slate-200"></tbody>
                </table>
            </div>
        </div>

        <div id="view-history" class="hidden space-y-4">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 divide-y divide-slate-100" id="history-container"></div>
        </div>

    </main>

    <!-- 모달 창들 -->
    <div id="modal-ai" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 space-y-4">
            <h3 class="font-bold text-lg">✨ AI 학부모 알림톡 생성</h3>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">대상 반 선택</label>
                <select id="ai-parent-class" class="w-full text-sm p-2 bg-slate-50 border rounded-lg"></select>
            </div>
            <button onclick="generateParentMessage()" class="w-full py-2 bg-purple-600 text-white rounded-lg font-bold">알림톡 문구 생성</button>
            <textarea id="ai-parent-result" rows="6" class="w-full text-xs p-3 bg-slate-50 border rounded-lg outline-none"></textarea>
            <button onclick="closeAiModal()" class="w-full py-2 bg-slate-800 text-white rounded-lg text-xs font-bold">닫기</button>
        </div>
    </div>

    <div id="modal-log" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6">
            <h3 class="font-bold text-lg mb-4" id="log-modal-title">📝 수업 진도 기록</h3>
            <form onsubmit="handleSaveLog(event)" class="space-y-3">
                <input type="hidden" id="log-id">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">날짜</label>
                        <input type="date" id="log-date" required class="w-full text-sm p-2 bg-slate-50 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">대상 반</label>
                        <select id="log-class" required class="w-full text-sm p-2 bg-slate-50 border rounded-lg"></select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">과목</label>
                    <select id="log-subject" required class="w-full text-sm p-2 bg-slate-50 border rounded-lg"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">진도 내용</label>
                    <input type="text" id="log-progress" required placeholder="예: 3/2026(고2) #6" class="w-full text-sm p-2 bg-slate-50 border rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">숙제 메모</label>
                    <textarea id="log-homework" rows="2" class="w-full text-sm p-2 bg-slate-50 border rounded-lg"></textarea>
                </div>
                <div class="flex justify-between pt-3">
                    <button type="button" id="btn-delete-log" onclick="deleteCurrentLog()" class="text-xs text-red-600 hidden font-bold">삭제</button>
                    <div class="flex gap-2 ml-auto">
                        <button type="button" onclick="closeLogModal()" class="px-3 py-1.5 text-xs text-slate-600">취소</button>
                        <button type="submit" class="px-4 py-1.5 text-xs bg-blue-600 text-white rounded-lg font-bold">저장</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-class" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
            <h3 class="font-bold text-lg">⚙️ 반 및 과목 설정</h3>
            <div>
                <h4 class="text-xs font-bold text-slate-500 mb-1">반 목록</h4>
                <div class="flex gap-2 mb-2">
                    <input type="text" id="new-class-input" placeholder="반 이름" class="flex-1 text-sm p-2 bg-slate-50 border rounded-lg">
                    <button onclick="addClass()" class="px-3 py-2 bg-slate-800 text-white text-xs rounded-lg font-bold">추가</button>
                </div>
                <ul id="class-list" class="space-y-1 bg-slate-50 p-2 rounded-lg border text-xs"></ul>
            </div>
            <div>
                <h4 class="text-xs font-bold text-slate-500 mb-1">과목 목록</h4>
                <div class="flex gap-2 mb-2">
                    <input type="text" id="new-subject-input" placeholder="과목 이름" class="flex-1 text-sm p-2 bg-slate-50 border rounded-lg">
                    <button onclick="addSubject()" class="px-3 py-2 bg-slate-800 text-white text-xs rounded-lg font-bold">추가</button>
                </div>
                <ul id="subject-list" class="space-y-1 bg-slate-50 p-2 rounded-lg border text-xs"></ul>
            </div>
            <button onclick="closeClassModal()" class="w-full py-2 bg-slate-800 text-white rounded-lg text-xs font-bold">닫기</button>
        </div>
    </div>

    <script>
        var DEFAULT_CLASSES = ['고1 (소연)', '고1 (우석, 수현, 태욱)', '고2 (규민, 동현)', '고3 (휘준, 영아, 리후)'];
        var DEFAULT_SUBJECTS = ['Grammar', 'Listening', 'Reading'];
        var DEFAULT_LOGS = [
            { id: 'log1', date: '2026-09-28', className: '고1 (소연)', subject: 'Listening', progress: '3/2026(고2) #6', homework: '' },
            { id: 'log2', date: '2026-09-28', className: '고1 (우석, 수현, 태욱)', subject: 'Grammar', progress: '3/2026(고2) #29', homework: '' },
            { id: 'log3', date: '2026-09-28', className: '고2 (규민, 동현)', subject: 'Reading', progress: '11/2023(고2) #24', homework: '' }
        ];

        var appClasses = DEFAULT_CLASSES;
        var appSubjects = DEFAULT_SUBJECTS;
        var appLogs = DEFAULT_LOGS;
        var currentView = 'matrix';
        var searchQuery = '';

        function initApp() {
            try {
                var c = localStorage.getItem('app_c_v10');
                var s = localStorage.getItem('app_s_v10');
                var l = localStorage.getItem('app_l_v10');
                if (c) appClasses = JSON.parse(c);
                if (s) appSubjects = JSON.parse(s);
                if (l) appLogs = JSON.parse(l);
            } catch(e) {}

            var dateInput = document.getElementById('log-date');
            if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];

            renderMatrixView();
            renderHistoryView();
            populateModalSelects();
        }

        function saveData() {
            try {
                localStorage.setItem('app_c_v10', JSON.stringify(appClasses));
                localStorage.setItem('app_s_v10', JSON.stringify(appSubjects));
                localStorage.setItem('app_l_v10', JSON.stringify(appLogs));
            } catch(e) {}
        }

        function switchView(viewName) {
            currentView = viewName;
            document.getElementById('view-matrix').classList.toggle('hidden', viewName !== 'matrix');
            document.getElementById('view-history').classList.toggle('hidden', viewName !== 'history');
            if (viewName === 'matrix') renderMatrixView();
            else renderHistoryView();
        }

        function renderMatrixView() {
            var thead = document.querySelector('#matrix-table thead tr');
            var tbody = document.getElementById('matrix-body');
            if (!thead || !tbody) return;

            thead.innerHTML = '<th class="p-3 border-r bg-slate-200">반 / 학생 명단</th>';
            appSubjects.forEach(function(sub) {
                thead.innerHTML += '<th class="p-3 border-r bg-slate-100 text-center">' + sub + '</th>';
            });

            tbody.innerHTML = '';
            appClasses.forEach(function(cls, cIdx) {
                var tr = document.createElement('tr');
                var tdClass = '<td class="p-3 border-r border-b bg-slate-50 text-center font-bold">' +
                    '<div>' + cls + '</div>' +
                    '<button onclick="openLogModalForClass(' + cIdx + ')" class="mt-1 text-xs text-blue-600 border px-2 py-0.5 rounded">+ 진도</button>' +
                    '</td>';
                tr.innerHTML = tdClass;

                appSubjects.forEach(function(sub) {
                    var logs = appLogs.filter(function(l) { return l.className === cls && l.subject === sub; });
                    var cellHtml = '<td class="p-3 border-r border-b text-xs align-top">';
                    if (logs.length > 0) {
                        logs.forEach(function(log) {
                            cellHtml += '<div onclick="openEditLogModal(\'' + log.id + '\')" class="p-2 border rounded mb-1 bg-white cursor-pointer">' +
                                '<div class="font-bold text-blue-600">📅 ' + log.date + '</div>' +
                                '<div>' + log.progress + '</div>' +
                                '</div>';
                        });
                    } else {
                        cellHtml += '<div class="text-slate-300 italic">기록 없음</div>';
                    }
                    cellHtml += '<button onclick="openLogModalFor(\'' + cls + '\', \'' + sub + '\')" class="mt-1 text-[11px] bg-slate-100 px-2 py-0.5 rounded border">+ 작성</button></td>';
                    tr.innerHTML += cellHtml;
                });
                tbody.appendChild(tr);
            });
        }

        function renderHistoryView() {
            var container = document.getElementById('history-container');
            if (!container) return;
            container.innerHTML = '';
            appLogs.forEach(function(log) {
                container.innerHTML += '<div class="p-3 flex justify-between items-center text-sm">' +
                    '<div><span class="font-bold">[' + log.className + ' - ' + log.subject + ']</span> ' + log.progress + '</div>' +
                    '<button onclick="openEditLogModal(\'' + log.id + '\')" class="text-xs border px-2 py-1 rounded">수정</button>' +
                    '</div>';
            });
        }

        function populateModalSelects() {
            var cOpts = appClasses.map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');
            var sOpts = appSubjects.map(function(s) { return '<option value="' + s + '">' + s + '</option>'; }).join('');
            document.getElementById('log-class').innerHTML = cOpts;
            document.getElementById('log-subject').innerHTML = sOpts;
            document.getElementById('ai-parent-class').innerHTML = cOpts;
        }

        function openLogModal() {
            document.getElementById('log-id').value = '';
            document.getElementById('log-progress').value = '';
            document.getElementById('log-homework').value = '';
            document.getElementById('btn-delete-log').classList.add('hidden');
            populateModalSelects();
            document.getElementById('modal-log').classList.remove('hidden');
        }
        function closeLogModal() { document.getElementById('modal-log').classList.add('hidden'); }
        function openLogModalFor(c, s) { openLogModal(); document.getElementById('log-class').value = c; document.getElementById('log-subject').value = s; }
        function openLogModalForClass(idx) { openLogModal(); document.getElementById('log-class').value = appClasses[idx]; }

        function openEditLogModal(id) {
            var log = appLogs.find(function(l) { return l.id === id; });
            if (!log) return;
            openLogModal();
            document.getElementById('log-id').value = log.id;
            document.getElementById('log-date').value = log.date;
            document.getElementById('log-class').value = log.className;
            document.getElementById('log-subject').value = log.subject;
            document.getElementById('log-progress').value = log.progress;
            document.getElementById('log-homework').value = log.homework || '';
            document.getElementById('btn-delete-log').classList.remove('hidden');
        }

        function handleSaveLog(e) {
            e.preventDefault();
            var id = document.getElementById('log-id').value;
            var newLog = {
                id: id || 'log_' + Date.now(),
                date: document.getElementById('log-date').value,
                className: document.getElementById('log-class').value,
                subject: document.getElementById('log-subject').value,
                progress: document.getElementById('log-progress').value,
                homework: document.getElementById('log-homework').value
            };
            if (id) {
                var idx = appLogs.findIndex(function(l) { return l.id === id; });
                if (idx !== -1) appLogs[idx] = newLog;
            } else {
                appLogs.unshift(newLog);
            }
            saveData();
            closeLogModal();
            renderMatrixView();
        }

        function deleteCurrentLog() {
            var id = document.getElementById('log-id').value;
            appLogs = appLogs.filter(function(l) { return l.id !== id; });
            saveData();
            closeLogModal();
            renderMatrixView();
        }

        function openAiModal() { populateModalSelects(); document.getElementById('modal-ai').classList.remove('hidden'); }
        function closeAiModal() { document.getElementById('modal-ai').classList.add('hidden'); }
        function generateParentMessage() {
            var cls = document.getElementById('ai-parent-class').value;
            var logs = appLogs.filter(function(l) { return l.className === cls; });
            var txt = logs.map(function(l) { return '• [' + l.subject + '] ' + l.progress; }).join('\n');
            document.getElementById('ai-parent-result').value = '[수업 진도 안내]\n안녕하세요! ' + cls + ' 진도 내역입니다.\n\n' + txt + '\n\n감사합니다.';
        }

        function openClassModal() { renderClassList(); document.getElementById('modal-class').classList.remove('hidden'); }
        function closeClassModal() { document.getElementById('modal-class').classList.add('hidden'); }
        function renderClassList() {
            document.getElementById('class-list').innerHTML = appClasses.map(function(c, i) { return '<li class="flex justify-between"><span>' + c + '</span><button onclick="removeClass(' + i + ')" class="text-red-500">삭제</button></li>'; }).join('');
            document.getElementById('subject-list').innerHTML = appSubjects.map(function(s, i) { return '<li class="flex justify-between"><span>' + s + '</span><button onclick="removeSubject(' + i + ')" class="text-red-500">삭제</button></li>'; }).join('');
        }
        function addClass() { var v = document.getElementById('new-class-input').value; if(v){ appClasses.push(v); saveData(); renderClassList(); renderMatrixView(); } }
        function removeClass(i) { appClasses.splice(i,1); saveData(); renderClassList(); renderMatrixView(); }
        function addSubject() { var v = document.getElementById('new-subject-input').value; if(v){ appSubjects.push(v); saveData(); renderClassList(); renderMatrixView(); } }
        function removeSubject(i) { appSubjects.splice(i,1); saveData(); renderClassList(); renderMatrixView(); }

        function exportData() {
            var str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ classes: appClasses, subjects: appSubjects, logs: appLogs }));
            var a = document.createElement('a'); a.href = str; a.download = 'backup.json'; a.click();
        }
        function importData(e) {
            var reader = new FileReader();
            reader.onload = function(evt) {
                var d = JSON.parse(evt.target.result);
                if(d.classes) appClasses = d.classes;
                if(d.subjects) appSubjects = d.subjects;
                if(d.logs) appLogs = d.logs;
                saveData(); renderMatrixView();
            };
            reader.readAsText(e.target.files[0]);
        }

        window.onload = initApp;
    </script>
</body>
</html>
